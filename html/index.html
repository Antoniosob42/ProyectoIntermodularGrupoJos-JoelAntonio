<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5STACK B42 - Dashboard</title>
    
    <!-- CSS Propio -->
    <link rel="stylesheet" href="../css/styles.css">
    
    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- Encabezado / Barra superior -->
    <header class="top-bar">
        <h1 class="title">M5STACK B42</h1>
        
        <div class="battery-container">
            <span class="battery-label">BATERIA</span>
            <div class="battery-bar-outer">
                <div class="battery-bar-inner" id="battery-level" style="width: 70%;"></div>
            </div>
            <span class="battery-value" id="battery-text">70%</span>
        </div>

        <button class="btn-export" id="btn-export">exportar datos</button>
    </header>

    <!-- Contenido principal -->
    <main class="dashboard-grid">
        
        <!-- Columna Izquierda: Sensores y Métricas -->
        <section class="left-panel">
            
            <!-- Tarjeta Velocidad -->
            <div class="card card-velocidad">
                <div class="card-header">
                    <span class="card-title">VELOCIDAD</span>
                    <span class="card-value" id="speed-value">10KM/H</span>
                </div>
                <div class="progress-line">
                    <div class="progress-fill" style="width: 20%;"></div>
                </div>
            </div>

            <!-- Tarjeta Acelerómetro (Gráfica Chart.js) -->
            <div class="card card-chart">
                <h2 class="card-title">ACELEROMETRO</h2>
                <div class="chart-container">
                    <canvas id="accelerometerChart"></canvas>
                </div>
            </div>

            <!-- Tarjeta Tiempo de Sesión -->
            <div class="card card-session">
                <h2 class="card-title">TIEMPO DE SESION</h2>
                <div class="session-info">
                    <div>INICIO <span id="time-start">0:00</span></div>
                    <div>FIN <span id="time-end">0:00</span></div>
                    <div>DURACION <span id="time-duration">0:00</span></div>
                </div>
            </div>

            <!-- Tarjeta Fuerza G -->
            <div class="card card-fuerzag">
                <div class="card-header">
                    <span class="card-title">FUERZA G</span>
                    <span class="card-value" id="gforce-value">5G</span>
                </div>
                <div class="progress-line">
                    <div class="progress-fill" style="width: 50%;"></div>
                </div>
            </div>

        </section>

        <!-- Columna Derecha: Mapa -->
        <section class="right-panel">
            <div class="card card-map">
                <div class="map-header">Mapa</div>
                <div id="map"></div>
            </div>
        </section>

    </main>

    <!-- Chart.js (Gráficas) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet JS (Mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JS Propio -->
    <script src="../js/main.js"></script>

</body>
</html>
